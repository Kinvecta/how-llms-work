name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 7 * * 1"   # weekly, Monday 07:41 UTC: the model-download notebooks too
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks-fast:
    name: Notebooks (no downloads), Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -c requirements.txt numpy matplotlib nbclient nbformat ipykernel
      - name: Run every notebook that needs no model download
        env:
          MPLBACKEND: Agg
        run: python tools/check_notebooks.py --fast

  notebooks-full:
    name: All notebooks, with GPT-2 small (Python 3.12)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install (CPU-only PyTorch)
        run: |
          python -m pip install -c requirements.txt torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run every notebook
        env:
          MPLBACKEND: Agg
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: python tools/check_notebooks.py

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check tools/
